name: Update Frontend Types

on:
  schedule:
    - cron: '0 4 * * 1' # Runs on Monday at 4:00 AM UTC
  workflow_dispatch:   # Allows manual trigger from the GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI_COMMIT_MESSAGE: |
        Continuous Integration - Update Frontend Types from Upstream Release
      CI_COMMIT_AUTHOR: Continuous Integration

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 1. Checkout My Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Check Upstream Release vs Local package.json
        id: check-release
        run: |
          # Enable strict error handling in the shell.
          set -e

          # Build an optional Authorization header array.
          AUTH_HEADER=()
          if [ -z "${{ env.ACT }}" ] && [ -n "${{ github.token }}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${{ github.token }}")
          fi

          # Request the latest release JSON and parse `tag_name`.
          RAW_TAG=$(curl -fsS \
            "${AUTH_HEADER[@]}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/home-assistant/frontend/releases/latest \
            | jq -r '.tag_name // empty')

          # Exit with status 1 if `RAW_TAG` is empty.
          if [ -z "$RAW_TAG" ]; then
            echo "Error: failed to fetch release tag from GitHub."
            exit 1
          fi

          echo "Latest upstream release tag: $RAW_TAG"

          # Validate strict semver without coercion; fail immediately on malformed tags.
          CLEAN_VERSION=$(npx --yes semver "${RAW_TAG}.0" 2>/dev/null) || {
            echo "Error: release tag '$RAW_TAG' is not valid semver."
            exit 1
          }

          # Write raw tag and normalized version to `$GITHUB_OUTPUT`.
          echo "raw_tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

          # Read and print the `version` field from `package.json`.
          SAVED_TAG=$(node -p "require('./package.json').version")
          echo "Current local package.json version: $SAVED_TAG"

          # Set `new_release=false` or `new_release=true` based on version and event type.
          if [ "$CLEAN_VERSION" = "$SAVED_TAG" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new release found. Skipping update."
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected or manually triggered!"
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

      - name: 3. Setup Node.js (Version 22)
        if: steps.check-release.outputs.new_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 4. Install Root Dependencies & Update package-lock.json
        if: steps.check-release.outputs.new_release == 'true'
        run: npm install

      - name: 5. Enable Corepack for pnpm Support
        if: steps.check-release.outputs.new_release == 'true'
        run: corepack enable

      - name: 6. Clone Exact Home Assistant Frontend Release Temporarily
        if: steps.check-release.outputs.new_release == 'true'
        run: |
          TARGET_TAG="${{ steps.check-release.outputs.raw_tag }}"
          echo "Cloning tag: $TARGET_TAG"
          rm -rf /tmp/temp-frontend
          git clone --depth 1 --branch "$TARGET_TAG" https://github.com/home-assistant/frontend.git /tmp/temp-frontend

      - name: 7. Install Temporary Frontend Dependencies via pnpm
        if: steps.check-release.outputs.new_release == 'true'
        working-directory: /tmp/temp-frontend
        run: pnpm install

      - name: 8. Create Lenient TypeScript Extraction Config
        if: steps.check-release.outputs.new_release == 'true'
        run: |
          cat << 'EOF' > /tmp/temp-frontend/tsconfig.extract.json
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "declaration": true,
              "emitDeclarationOnly": true,
              "rootDir": "./src",
              "outDir": "${{ github.workspace }}/dist",
              "strict": false,
              "noEmitOnError": false,
              "skipLibCheck": true,
              "experimentalDecorators": true
            },
            "include": [
              "src/types.ts",
              "src/data/**/*.ts",
              "src/panels/lovelace/**/*.ts"
            ]
          }
          EOF

      - name: 9a. Compile TypeScript Types into dist Folder
        if: steps.check-release.outputs.new_release == 'true'
        working-directory: /tmp/temp-frontend
        run: npx tsc -p tsconfig.extract.json || true

      - name: 9b. Patch Extracted TypeScript Declarations
        if: steps.check-release.outputs.new_release == 'true'
        run: npm run patch:types

      - name: 10a. Generate Index Declaration File
        if: steps.check-release.outputs.new_release == 'true'
        run: npm run generate:index-dts

      - name: 10b. Typecheck Declarations
        if: steps.check-release.outputs.new_release == 'true'
        run: npm run typecheck

      - name: 11. Update package.json and package-lock.json Version
        if: steps.check-release.outputs.new_release == 'true'
        run: |
          # Write the validated semver version without leading `v` to package.json and package-lock.json.
          CLEAN_VERSION="${{ steps.check-release.outputs.clean_version }}"
          node -e "
            const fs = require('fs');
            const nextVersion = process.argv[1];

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = nextVersion;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            if (fs.existsSync('package-lock.json')) {
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              lock.version = nextVersion;
              if (lock.packages && lock.packages['']) {
                lock.packages[''].version = nextVersion;
              }
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            }
          " "$CLEAN_VERSION"

      - name: 12. Check If Files Have Changed
        id: checkDiff
        if: steps.check-release.outputs.new_release == 'true'
        run: |
          set -e
          git config --global --add safe.directory '*'

          # Detect modified or untracked files in dist, package.json, and package-lock.json.
          if [ -n "$(git status --porcelain -- dist package.json package-lock.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 13a. Clean Up Temporary Frontend Source Files
        if: steps.check-release.outputs.new_release == 'true'
        run: rm -rf /tmp/temp-frontend || true

      - name: 13b. Clean Up node_modules on Local Run (act)
        if: always() && steps.check-release.outputs.new_release == 'true' && env.ACT == 'true'
        run: rm -rf node_modules || true

      - name: 14. Commit and Tag (and Push on GitHub)
        if: steps.check-release.outputs.new_release == 'true' && steps.checkDiff.outputs.changed == 'true'
        run: |
          set -e

          # Trust mounted repository inside Docker/WSL containers.
          git config --global --add safe.directory '*'

          # Configure Git committer identity.
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "ci_activity@noreply.github.com"

          # Stage and commit only updated or new artifacts.
          git add -- dist package.json package-lock.json
          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"

          # Move tag to the new commit using upstream Frontend release tag format.
          RELEASE_TAG="${{ steps.check-release.outputs.raw_tag }}"
          git tag -f "$RELEASE_TAG"

          # Push only when not running locally in act.
          if [ "${{ env.ACT }}" = "true" ]; then
            echo "Running in act: local commit and tag created, skipping git push."
          else
            git push
            git push origin --force "$RELEASE_TAG"
          fi
