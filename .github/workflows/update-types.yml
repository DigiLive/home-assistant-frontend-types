name: Update Frontend Types

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 4:00 AM UTC
  workflow_dispatch:   # Allows manual trigger from the GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI_COMMIT_MESSAGE: |
        Continuous Integration - Update Frontend Types from Upstream Release

        [skip codacy]
      CI_COMMIT_AUTHOR: Continuous Integration

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_GIT_ACCESS_TOKEN }}

      - name: Check Upstream Release
        id: check-release
        run: |
          RAW_TAG=$(curl -s https://api.github.com/repos/home-assistant/frontend/releases/latest | jq -r .tag_name)
          LATEST_TAG="${RAW_TAG#v}"
          echo "Latest upstream release: $LATEST_TAG"

          SAVED_TAG=$(node -p "require('./package.json').version")
          echo "Current package.json version: $SAVED_TAG"

          if [ "$LATEST_TAG" = "$SAVED_TAG" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new release found. Skipping update."
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected or manually triggered!"
            echo "new_release=true" >> $GITHUB_OUTPUT
          
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$LATEST_TAG';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi

      - name: Setup Node.js
        if: steps.check-release.outputs.new_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Node Install
        if: steps.check-release.outputs.new_release == 'true'
        run: npm ci

      - name: Clone Home Assistant Frontend
        if: steps.check-release.outputs.new_release == 'true'
        run: |
          git clone --depth 1 https://github.com/home-assistant/frontend.git temp-frontend

      - name: Install Frontend Dependencies
        if: steps.check-release.outputs.new_release == 'true'
        working-directory: ./temp-frontend
        run: npm ci

      - name: Create Extraction Config
        if: steps.check-release.outputs.new_release == 'true'
        run: |
          cat << 'EOF' > tsconfig.extract.json
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "declaration": true,
              "emitDeclarationOnly": true,
              "outDir": "./dist",
              "strict": true,
              "skipLibCheck": true,
              "experimentalDecorators": true
            },
            "include": [
              "temp-frontend/src/types.ts",
              "temp-frontend/src/data/**/*.ts",
              "temp-frontend/src/panels/lovelace/**/*.ts"
            ]
          }
          EOF

      - name: Compile Types via tsc
        if: steps.check-release.outputs.new_release == 'true'
        run: npx tsc -p tsconfig.extract.json

      - name: Clean up temporary frontend source
        if: steps.check-release.outputs.new_release == 'true'
        run: rm -rf temp-frontend tsconfig.extract.json

      - name: Generate Index DTS
        if: steps.check-release.outputs.new_release == 'true'
        run: node generate-index-dts.js

      - name: Check for file changes
        id: checkDiff
        if: steps.check-release.outputs.new_release == 'true'
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Types Build
        if: steps.check-release.outputs.new_release == 'true' && steps.checkDiff.outputs.changed == 'true'
        run: |
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "ci_activity@noreply.github.com"
          git add dist package.json
          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push